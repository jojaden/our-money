<!-- @dsCard group="Navigation" height=640 subtitle="달력은 넓게, 월 전체 목록은 메뉴로. 날짜를 누르면 그날 패널과 +가 열립니다." -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--ground); color: var(--text); font-family: var(--font-text); }
  button { font: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cal-head { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .icon { display: grid; place-items: center; flex: none; width: 44px; height: 44px; border: 0; border-radius: var(--radius-control); background: var(--accent-soft); color: var(--accent-ink); }
  .icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; }
  h1 { margin: 0; font: 700 32px/36px var(--font-display); }
  .week, .grid { display: grid; grid-template-columns: repeat(7,minmax(0,1fr)); gap: 4px 2px; }
  .week { margin-bottom: 8px; text-align: center; color: var(--muted); font-size: 12px; }
  .day { display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 88px; padding: 6px 2px; border: 0; border-radius: var(--radius-small); background: var(--well); color: var(--text); }
  .day.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .n { font-family: var(--font-display); }
  .event { overflow: hidden; width: 100%; padding: 2px; border-radius: 4px; color: var(--accent-ink); background: var(--accent-soft); text-align: left; font-size: 10px; white-space: nowrap; text-overflow: ellipsis; }
  dialog { position: fixed; inset: auto 0 0; width: 100%; max-width: 560px; min-height: 360px; max-height: 90dvh; margin: 0 auto; padding: 20px; overflow-y: auto; border: 0; border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; background: var(--surface); color: var(--text); }
  dialog::backdrop { background: color-mix(in srgb,var(--text) 40%,transparent); }
  dialog[open] { animation: panel-in var(--dur-swap) var(--ease-out); }
  .panel-head { display: flex; align-items: center; gap: 8px; }
  h2 { flex: 1; margin: 0; font-size: 20px; }
  .entry { margin-top: 24px; padding: 16px 0; border-bottom: 1px solid var(--rule); }
  .entry p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  .tabs { display: flex; gap: 8px; margin-top: 20px; }
  .tabs button { min-height: 44px; padding: 0 16px; border: 0; border-radius: var(--radius-control); background: var(--accent-soft); color: var(--accent-ink); }
  label { display: block; margin-top: 24px; }
  input { display: block; width: 100%; min-height: 48px; margin-top: 8px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-control); background: var(--surface); color: var(--text); font: inherit; }
  .help { margin: 16px 0 0; color: var(--muted); font-size: 13px; }
  @keyframes panel-in { from { transform: translateY(100%); } }
  @media (prefers-reduced-motion: reduce) { dialog[open] { animation: none; } }
</style>
<header class="cal-head"><button class="icon" type="button" id="menu" aria-label="달력 메뉴"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><h1>11월</h1></header>
<div class="week" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
<div class="grid" aria-label="11월 달력"></div>
<p class="help">날짜를 누르면 그날 일정이 열려요.</p>
<dialog id="panel" aria-labelledby="panel-title"><div class="panel-head"><h2 id="panel-title"></h2><button type="button" class="icon" id="add" aria-label="선택한 날짜에 일정 추가"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg></button><button type="button" class="icon" id="close" aria-label="닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div id="body"></div></dialog>
<script>
  const events = { 6: "저녁 약속", 10: "건강검진", 18: "가족 모임", 25: "월급날" };
  const grid = document.querySelector('.grid');
  const panel = document.querySelector('#panel');
  const title = document.querySelector('#panel-title');
  const body = document.querySelector('#body');
  const add = document.querySelector('#add');
  let day = 6;
  for (let n=1;n<=35;n++) {
    const b=document.createElement('button'); b.type='button'; b.className='day'+(n===6?' today':'');
    if(n>30){b.disabled=true;b.setAttribute('aria-hidden','true');grid.append(b);continue;}
    b.setAttribute('aria-label',`11월 ${n}일${events[n]?', '+events[n]:''}`);
    const date=document.createElement('span');date.className='n';date.textContent=n;b.append(date);
    if(events[n]){const e=document.createElement('span');e.className='event';e.textContent=events[n];b.append(e);}
    b.onclick=()=>{day=n;title.textContent=`11월 ${n}일`;add.hidden=false;body.replaceChildren();const row=document.createElement('p');row.className='entry';row.textContent=events[n]||'이날은 일정이 없어요. +로 일정을 추가해 보세요.';body.append(row);panel.showModal();};
    grid.append(b);
  }
  document.querySelector('#menu').onclick=()=>{title.textContent='11월 모아 보기';add.hidden=true;body.innerHTML='<div class="tabs"><button type="button" data-tab="month">할 일·일정</button><button type="button" data-tab="dday">D-day</button></div><div class="entry" id="list">11월 6일 저녁 약속<br>11월 10일 건강검진</div>';body.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelector('#list').textContent=b.dataset.tab==='dday'?'가족 모임 · D-12':'11월 6일 저녁 약속 · 11월 10일 건강검진';});panel.showModal();};
  add.onclick=()=>{title.textContent='새 일정';add.hidden=true;body.innerHTML=`<label>제목<input placeholder="일정 제목"></label><label>날짜<input type="date" value="2026-11-${String(day).padStart(2,'0')}"></label><p class="help">앱에서는 시간·반복·누구·알림·메모도 설정할 수 있어요.</p>`;};
  document.querySelector('#close').onclick=()=>panel.close();
</script>
