<!-- @dsCard group="셸" height=300 subtitle="새 화면은 오른쪽에서, 뒤로가기는 반대 방향으로 — 버튼을 눌러 보세요" -->
<style>
  body { margin: 0; font-family: var(--font-text); color: var(--text); background: var(--ground); }
  header { display: flex; gap: 12px; align-items: center; padding: 16px; background: var(--surface); }
  button { min-height: 44px; padding: 0 16px; border: 0; border-radius: var(--radius-control); background: var(--accent-soft); color: var(--accent-ink); font: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  main { padding: 24px; min-height: 190px; box-sizing: border-box; background: var(--ground); view-transition-name: page; }
  h2 { margin: 0 0 12px; font-size: 24px; }
  p { margin: 0 0 24px; color: var(--muted); }
  ::view-transition-old(root) { display: none; }
  ::view-transition-new(root) { animation: none; }
  ::view-transition-group(page) { animation-duration: var(--dur-tab); }
  ::view-transition-old(page), ::view-transition-new(page) { mix-blend-mode: normal; animation-duration: var(--dur-tab); animation-timing-function: var(--ease-drawer); animation-fill-mode: both; }
  ::view-transition-new(page) { animation-name: push-in; }
  ::view-transition-old(page) { animation-name: push-out; }
  html[data-back]::view-transition-new(page) { animation-name: pop-in; }
  html[data-back]::view-transition-old(page) { z-index: 2; animation-name: pop-out; }
  @keyframes push-in { from { transform: translateX(100%); } }
  @keyframes push-out { to { transform: translateX(-25%); opacity: 0.7; } }
  @keyframes pop-in { from { transform: translateX(-25%); opacity: 0.7; } }
  @keyframes pop-out { to { transform: translateX(100%); } }
  @media (prefers-reduced-motion: reduce) { ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; } }
</style>
<header><button type="button" id="back" disabled>뒤로</button><strong>우리 집</strong></header>
<main><h2>이번 달</h2><p>새 화면과 돌아가는 방향을 확인해 보세요.</p><button type="button" id="open">체크 열기</button></main>
<script>
  const page = document.querySelector("main");
  const back = document.querySelector("#back");
  const show = (detail) => {
    document.documentElement.toggleAttribute("data-back", !detail);
    const update = () => {
      back.disabled = !detail;
      page.querySelector("h2").textContent = detail ? "이번 달 체크" : "이번 달";
      page.querySelector("p").textContent = detail ? "뒤로를 누르면 이전 화면이 드러나요." : "새 화면과 돌아가는 방향을 확인해 보세요.";
      page.querySelector("#open").hidden = detail;
    };
    if (document.startViewTransition) document.startViewTransition(update);
    else update();
  };
  document.querySelector("#open").onclick = () => show(true);
  back.onclick = () => show(false);
</script>
