<!-- @dsCard group="Moments" height=560 subtitle="처음 불러올 때: 따뜻한 무대 위에서 두 사람의 동전이 다가가 겹쳤다 멀어지기를 되풀이" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&family=Noto+Sans+KR:wght@400..800&display=swap">
<style>
  body { margin: 0; background: var(--ground); color: var(--text); font-family: var(--font-text); word-break: keep-all; -webkit-font-smoothing: antialiased; }
  .stage { padding: 20px; }
  /* 따뜻한 무대: 가운데가 밝은 복숭아빛 원형 그라데이션 */
  .screen { position: relative; max-width: 390px; height: 520px; overflow: hidden; border-radius: var(--radius-card); background: radial-gradient(130% 75% at 50% 36%, color-mix(in srgb, var(--warm-50) 35%, var(--surface)) 0%, var(--warm-50) 40%, var(--warm-100) 100%); box-shadow: var(--shadow-card); }

  .scene { position: absolute; left: 0; right: 0; top: 70px; height: 250px; }
  .brand { position: absolute; left: 50%; top: 0; width: 174px; margin-left: -87px; }
  .roof { display: block; width: 124px; margin: 0 auto 12px; overflow: visible; }
  .roof polyline { fill: none; stroke: var(--primary); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 6px 8px color-mix(in srgb, var(--primary) 28%, transparent)); }
  .pair { position: relative; height: 104px; }
  /* 동전: 왼쪽 위에서 빛을 받은 둥근 면, 아래로 같은 색 그림자 */
  .coin { position: absolute; top: 0; width: 104px; height: 104px; border-radius: 50%; }
  .coin.a { --p: var(--a); --q: var(--a-ink); left: 0; }
  .coin.b { --p: var(--b); --q: var(--b-ink); left: 70px; overflow: hidden; }
  .coin.a, .coin.b {
    background: radial-gradient(circle at 34% 30%, color-mix(in srgb, var(--p) 22%, var(--surface)) 0%, color-mix(in srgb, var(--p) 58%, var(--surface)) 42%, color-mix(in srgb, var(--p) 88%, var(--surface)) 100%);
    box-shadow: inset -8px -12px 20px color-mix(in srgb, var(--q) 14%, transparent), 0 16px 26px -12px color-mix(in srgb, var(--p) 60%, transparent);
  }
  /* 겹친 자리: 앱 아이콘처럼 흰 렌즈 (b 안에서 a 와 같은 자리에 흰 원을 둔다) */
  .lens { position: absolute; top: 0; left: -70px; width: 104px; height: 104px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, var(--surface) 55%, color-mix(in srgb, var(--b) 10%, var(--surface)) 100%); }
  .floor { position: absolute; left: 50%; top: 178px; width: 176px; height: 22px; margin-left: -88px; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--text) 15%, transparent), transparent); }
  /* 곁에 놓인 동전 둘: 멀리 흐린 것과 가까이 기운 것 (움직이지 않는다) */
  .obj { position: absolute; border-radius: 50%; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--g-allowance) 22%, var(--surface)) 0%, color-mix(in srgb, var(--g-allowance) 70%, var(--surface)) 40%, var(--g-allowance) 78%, color-mix(in srgb, var(--g-allowance) 70%, var(--warning)) 100%); box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--surface) 30%, transparent); }
  .obj.far { left: -24px; top: 22px; width: 76px; height: 76px; filter: blur(5px); opacity: .8; }
  .obj.near { right: 38px; top: 168px; width: 32px; height: 32px; transform: rotate(-20deg) scaleX(.78); }

  .coin.a { animation: meet-a var(--dur-breathe) var(--ease-breathe) infinite; }
  .coin.b { animation: meet-b var(--dur-breathe) var(--ease-breathe) infinite; }
  .lens { animation: meet-l var(--dur-breathe) var(--ease-breathe) infinite; }
  @keyframes meet-a { 0%, 100% { transform: translateX(-10px); } 50% { transform: none; } }
  @keyframes meet-b { 0%, 100% { transform: translateX(10px); } 50% { transform: none; } }
  @keyframes meet-l { 0%, 100% { transform: translateX(-20px); } 50% { transform: none; } }

  .copy { position: absolute; left: 24px; right: 24px; top: 342px; display: grid; justify-items: center; gap: 10px; text-align: center; }
  h2 { margin: 0; font: 700 26px/32px var(--font-text); letter-spacing: -0.02em; text-wrap: balance; }
  p { margin: 0; color: var(--muted); font: 400 17px/26px var(--font-text); }
  @media (prefers-reduced-motion: reduce) { .coin.a, .coin.b, .lens { animation: none; } }
</style>
<div class="stage">
  <div class="screen" role="status" aria-live="polite">
    <div class="scene" aria-hidden="true">
      <span class="obj far"></span>
      <span class="obj near"></span>
      <span class="floor"></span>
      <div class="brand">
        <svg class="roof" viewBox="0 0 124 48"><polyline points="12 40 62 10 112 40"/></svg>
        <div class="pair"><span class="coin a"></span><span class="coin b"><span class="lens"></span></span></div>
      </div>
    </div>
    <div class="copy">
      <h2>가계부를 펼치는 중이에요</h2>
      <p>두 사람의 기록을 맞추고 있어요</p>
    </div>
  </div>
</div>
