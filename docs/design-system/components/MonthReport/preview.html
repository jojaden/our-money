<!-- @dsCard group="Moments" height=640 subtitle="그달이 끝나면 한 장으로: 쓴 돈·지난달 차이 → 나간 돈 구성 → 눈에 띈 것 → 생활비 결과" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&family=Noto+Sans+KR:wght@400..800&display=swap">
<style>
  body { margin: 0; background: var(--ground); color: var(--text); font-family: var(--font-text); word-break: keep-all; -webkit-font-smoothing: antialiased; }
  .stage { padding: 20px; }
  .sheet { max-width: 390px; padding: 20px; box-sizing: border-box; border-radius: var(--radius-sheet); background: var(--surface); box-shadow: var(--shadow-float); }
  h2 { margin: 0 0 14px; font: 700 20px/28px var(--font-text); }
  .label { color: var(--faint); font: 600 15px/20px var(--font-text); }
  .amt { font: 700 34px/40px var(--font-display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .amt small { margin-left: 2px; font: 700 22px/1 var(--font-text); }
  .sub { margin: 4px 0 0; color: var(--muted); font: 500 14.5px/20px var(--font-text); }
  .sub b { color: var(--text); }
  .h { margin: 18px 0 4px; color: var(--faint); font: 600 13px/18px var(--font-text); }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) 112px; gap: 12px; padding: 10px 0; }
  .row + .row { box-shadow: inset 0 0.6px 0 var(--rule); }
  .t { font: 500 16px/22px var(--font-text); }
  .r { text-align: right; font: 700 16px/22px var(--font-display); font-variant-numeric: tabular-nums; }
  .r small { display: block; color: var(--faint); font: 500 13px/18px var(--font-text); }
  .track { height: 8px; margin-top: 8px; border-radius: var(--radius-chip); background: var(--well); overflow: hidden; }
  .fill { height: 100%; border-radius: inherit; background: var(--accent); }
  .living { margin: 0; color: var(--muted); font: 500 14.5px/22px var(--font-text); }
  .living b { color: var(--positive); }
</style>
<div class="stage">
  <div class="sheet" role="dialog" aria-label="10월 결산">
    <h2>10월 결산</h2>
    <div class="label">10월에 쓴 돈</div>
    <div class="amt">1,322,700<small>원</small></div>
    <p class="sub">지난달보다 <b>120,000원</b> 덜 썼어요 · 기록 31건</p>
    <div class="h">나간 돈 5,196,600원</div>
    <div class="row"><div><div class="t">고정비</div><div class="track"><div class="fill" style="width:36%"></div></div></div><div class="r">1,873,900원<small>36%</small></div></div>
    <div class="row"><div><div class="t">공동 생활비</div><div class="track"><div class="fill" style="width:25%"></div></div></div><div class="r">1,322,700원<small>25%</small></div></div>
    <div class="row"><div><div class="t">저축·투자</div><div class="track"><div class="fill" style="width:38%"></div></div></div><div class="r">2,000,000원<small>38%</small></div></div>
    <div class="h">공동 생활비</div>
    <p class="living">예산 1,400,000원 중 1,322,700원 · <b>77,300원 남겼어요</b></p>
  </div>
</div>
