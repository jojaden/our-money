<!-- @dsCard group="Cards" height=980 subtitle="홈 첫 카드는 굵은 반원 호와 흰 바탕으로 스며드는 하늘, 결제수단 비율 막대, 작은 카드는 270° 게이지 — '+ 지출'을 눌러 호·끝 점·숫자가 이어지는 모습을 보세요" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&family=Noto+Sans+KR:wght@400..800&display=swap">
<style>
  body { margin: 0; background: var(--ground); color: var(--text); font-family: var(--font-text); word-break: keep-all; -webkit-font-smoothing: antialiased; }
  p, dl, dd { margin: 0; }
  .stage { display: grid; gap: var(--gap); max-width: 390px; padding: 20px; box-sizing: border-box; }
  .demo { justify-self: end; height: 34px; padding: 0 14px; border: 0; border-radius: var(--radius-chip); background: var(--surface); box-shadow: var(--shadow-raise); color: var(--accent-ink); font: 600 14.5px/34px var(--font-text); cursor: pointer; transition: transform var(--dur-press) var(--ease-press); }
  .demo:active { transform: scale(.96); }
  .demo:focus-visible, .aside:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 버킷이 게이지 색(--c)과 글자 색(--ink)을 정한다 */
  .living { --c: var(--g-living); --ink: var(--accent-ink); }
  .allow { --c: var(--g-allowance); --ink: var(--warning); }
  .card.over { --c: var(--negative); --ink: var(--pill-negative-ink); }
  .card { overflow: hidden; background: var(--surface); border-radius: var(--radius-card); box-shadow: var(--shadow-card); }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: var(--pad) var(--pad) 0; }
  .head h3 { margin: 0; font: 700 20px/28px var(--font-text); letter-spacing: -0.02em; }
  .aside { color: var(--faint); font: 500 14.5px/20px var(--font-text); text-decoration: none; border-radius: 6px; }

  svg path { fill: none; stroke-linecap: round; }
  /* 빛을 머금은 튜브: 빈자리는 굵기 방향 입체의 흰 라일락, 채운 호는 옅은 → 진한 끝 + 반투명 입체 + 둘레 빛 */
  .tk-edge { stop-color: color-mix(in srgb, var(--lilac) 82%, var(--muted)); }
  .tk-body { stop-color: color-mix(in srgb, var(--lilac) 45%, var(--surface)); }
  .tk-light { stop-color: var(--surface); }
  .tk-rim { stop-color: color-mix(in srgb, var(--lilac) 88%, var(--muted)); }
  .lg-from { stop-color: color-mix(in srgb, var(--c) 46%, var(--surface)); }
  .lg-to { stop-color: var(--c); }
  .vo-shade { stop-color: var(--text); }
  .vo-light { stop-color: var(--surface); }
  .fl path { stroke-dasharray: 100 100; stroke-dashoffset: var(--off, 100); }
  .fl .halo { opacity: .45; filter: blur(7px); }
  .compact .fl .halo { filter: blur(4px); }
  .mile { fill: var(--surface); stroke: var(--ink); }
  .knob { fill: var(--surface); filter: drop-shadow(0 1px 2px color-mix(in srgb, var(--text) 25%, transparent)); }

  .cap { color: var(--faint); font: 500 14.5px/20px var(--font-text); }
  .fig { font: 700 36px/42px var(--font-display); letter-spacing: -0.02em; }
  .fig .won { margin-left: 2px; font-size: .62em; font-weight: 600; color: var(--faint); }
  .over .fig { color: var(--negative); }
  .sub { color: var(--muted); font: 500 14.5px/20px var(--font-text); }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: var(--radius-chip); font: 600 14px/30px var(--font-text); white-space: nowrap; }
  .pill svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .pill.good { background: var(--pill-positive-bg); color: var(--pill-positive-ink); }
  .pill.warn { background: var(--pill-warning-bg); color: var(--pill-warning-ink); }
  .pill.bad { background: var(--pill-negative-bg); color: var(--pill-negative-ink); }
  .daily { color: var(--muted); font: 500 14.5px/20px var(--font-text); }
  .daily b { color: var(--text); font-weight: 700; }

  /* 홈 첫 카드: 하늘 머리 + 굵은 반원 호, 하늘색이 흰 바탕으로 스며든다 */
  .sky { padding-bottom: 4px; background: linear-gradient(180deg, var(--sky-100) 0%, var(--glow) 55%, var(--surface) 100%); }
  .arc { position: relative; width: min(100% - 40px, 300px); margin: 6px auto 0; }
  .arc svg { display: block; width: 100%; overflow: visible; }
  .mile-t { fill: var(--ink); font: 600 11px var(--font-text); letter-spacing: .02em; }
  .pct { position: absolute; left: 0; right: 0; bottom: 14px; display: grid; justify-items: center; }
  .pct b { font: 800 44px/46px var(--font-display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .pct .u { margin-left: 1px; font-size: .5em; font-weight: 700; color: var(--faint); }
  .pct small { color: var(--faint); font: 600 12.5px/16px var(--font-text); }
  .panel { display: grid; justify-items: center; gap: 2px; padding: 10px var(--pad) var(--pad); text-align: center; }
  .panel .pill { margin-top: 14px; }
  .panel .daily { margin-top: 8px; }
  /* 결제수단 나눔: 비율 막대 + 목록 (0원은 빼고 카드·현금·계좌이체 순서·색 고정) */
  .kinds { width: 100%; max-width: 440px; margin-top: 20px; text-align: left; }
  .kinds .bar { display: flex; gap: 2px; height: 8px; }
  .kinds .bar i { min-width: 4px; border-radius: 4px; background: var(--k); }
  .kinds ul { margin: 6px 0 0; padding: 0; list-style: none; }
  .kinds li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 0; }
  .kinds li + li { background: linear-gradient(var(--rule), var(--rule)) 22px 0 / calc(100% - 22px) 0.6px no-repeat; }
  .kinds li i { width: 10px; height: 10px; border-radius: var(--radius-chip); background: var(--k); }
  .kinds .n { font: 500 16px/24px var(--font-text); }
  .kinds .v { margin-left: 4px; color: var(--faint); font: 500 12.5px/16px var(--font-text); }
  .kinds b { font: 600 17px/24px var(--font-display); font-variant-numeric: tabular-nums; }
  .k-card { --k: var(--kind-card); } .k-cash { --k: var(--kind-cash); } .k-transfer { --k: var(--kind-transfer); }

  /* 작은 카드: 왼쪽 답 숫자 + 오른쪽 270° 게이지 */
  .body { display: grid; grid-template-columns: minmax(0, 1fr) 96px; align-items: center; gap: 12px; padding: 14px var(--pad) 0; }
  .compact .fig { font-size: 28px; line-height: 34px; }
  .compact .sub { text-wrap: balance; }
  .mini { position: relative; width: 96px; height: 96px; }
  .mini svg { display: block; width: 96px; height: 96px; overflow: visible; }
  .mini .pct { inset: 0; place-content: center; text-align: center; }
  .mini .pct b { font-size: 20px; line-height: 22px; letter-spacing: -0.02em; }
  .foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 14px var(--pad) 0; }
  .kinds-line { padding: 12px var(--pad) var(--pad); color: var(--faint); font: 500 12.5px/16px var(--font-text); }
  @media (prefers-reduced-motion: reduce) { .demo { transition: none; } }
</style>
<div class="stage">
  <button type="button" class="demo" id="add">+ 지출 32,000원</button>

  <section class="card living" id="lead" aria-labelledby="lead-h">
    <div class="sky">
      <div class="head"><h3 id="lead-h">남은 공동 생활비</h3><a class="aside" href="#">가계부 ›</a></div>
      <div class="arc">
        <svg viewBox="0 0 300 160" role="img" data-svg>
          <defs>
            <path id="lead-t" d="M52 148 A98 98 0 0 1 248 148"/>
            <!-- 굵기 방향 자리: 안쪽 113 → 바깥 135 (반지름 124, 굵기 22) -->
            <radialGradient id="lead-k" gradientUnits="userSpaceOnUse" cx="150" cy="148" r="135"><stop offset=".837" class="tk-edge"/><stop offset=".886" class="tk-body"/><stop offset=".935" class="tk-light"/><stop offset=".974" class="tk-body"/><stop offset="1" class="tk-rim"/></radialGradient>
            <radialGradient id="lead-v" gradientUnits="userSpaceOnUse" cx="150" cy="148" r="135"><stop offset=".837" class="vo-shade" stop-opacity=".22"/><stop offset=".886" class="vo-shade" stop-opacity="0"/><stop offset=".935" class="vo-light" stop-opacity=".32"/><stop offset=".974" class="vo-light" stop-opacity="0"/><stop offset="1" class="vo-shade" stop-opacity=".14"/></radialGradient>
          </defs>
          <path stroke="url(#lead-k)" stroke-width="22" d="M26 148 A124 124 0 0 1 274 148"/>
          <g class="fl" data-fill>
            <linearGradient id="lead-l" gradientUnits="userSpaceOnUse" x1="26" y1="148" x2="26" y2="148"><stop offset="0" class="lg-from"/><stop offset="1" class="lg-to"/></linearGradient>
            <path class="halo" stroke="url(#lead-l)" stroke-width="30" pathLength="100" d="M26 148 A124 124 0 0 1 274 148"/>
            <path stroke="url(#lead-l)" stroke-width="22" pathLength="100" d="M26 148 A124 124 0 0 1 274 148"/>
            <path stroke="url(#lead-v)" stroke-width="22" pathLength="100" d="M26 148 A124 124 0 0 1 274 148"/>
          </g>
          <circle class="mile" data-mile r="4.5" stroke-width="2"/>
          <text class="mile-t"><textPath href="#lead-t" data-mile-t text-anchor="middle">오늘</textPath></text>
          <circle class="knob" data-knob r="6.5"/>
        </svg>
        <div class="pct" aria-hidden="true"><b><span data-pct>0</span><span class="u">%</span></b><small>사용</small></div>
      </div>
    </div>
    <div class="panel">
      <p class="cap" data-cap>남은 돈</p>
      <p class="fig"><span data-left>0</span><span class="won">원</span></p>
      <p class="sub" data-sub></p>
      <p class="pill" data-pill></p>
      <p class="daily" data-daily></p>
      <div class="kinds" data-kinds></div>
    </div>
  </section>

  <section class="card compact allow" id="mini" aria-labelledby="mini-h">
    <div class="head"><h3 id="mini-h">현빈 용돈</h3><a class="aside" href="#">플랜 ›</a></div>
    <div class="body">
      <div>
        <p class="cap" data-cap>남은 돈</p>
        <p class="fig"><span data-left>0</span><span class="won">원</span></p>
        <p class="sub" data-sub></p>
      </div>
      <div class="mini">
        <svg viewBox="0 0 92 92" role="img" data-svg>
          <defs>
            <!-- 굵기 방향 자리: 안쪽 33 → 바깥 43 (반지름 38, 굵기 10) -->
            <radialGradient id="mini-k" gradientUnits="userSpaceOnUse" cx="46" cy="46" r="43"><stop offset=".767" class="tk-edge"/><stop offset=".837" class="tk-body"/><stop offset=".907" class="tk-light"/><stop offset=".963" class="tk-body"/><stop offset="1" class="tk-rim"/></radialGradient>
            <radialGradient id="mini-v" gradientUnits="userSpaceOnUse" cx="46" cy="46" r="43"><stop offset=".767" class="vo-shade" stop-opacity=".22"/><stop offset=".837" class="vo-shade" stop-opacity="0"/><stop offset=".907" class="vo-light" stop-opacity=".32"/><stop offset=".963" class="vo-light" stop-opacity="0"/><stop offset="1" class="vo-shade" stop-opacity=".14"/></radialGradient>
          </defs>
          <path stroke="url(#mini-k)" stroke-width="10" d="M19.13 72.87 A38 38 0 1 1 72.87 72.87"/>
          <g class="fl" data-fill>
            <linearGradient id="mini-l" gradientUnits="userSpaceOnUse" x1="19.13" y1="72.87" x2="19.13" y2="72.87"><stop offset="0" class="lg-from"/><stop offset="1" class="lg-to"/></linearGradient>
            <path class="halo" stroke="url(#mini-l)" stroke-width="14" pathLength="100" d="M19.13 72.87 A38 38 0 1 1 72.87 72.87"/>
            <path stroke="url(#mini-l)" stroke-width="10" pathLength="100" d="M19.13 72.87 A38 38 0 1 1 72.87 72.87"/>
            <path stroke="url(#mini-v)" stroke-width="10" pathLength="100" d="M19.13 72.87 A38 38 0 1 1 72.87 72.87"/>
          </g>
          <circle class="mile" data-mile r="2.6" stroke-width="1.5"/>
          <circle class="knob" data-knob r="3"/>
        </svg>
        <div class="pct" aria-hidden="true"><b><span data-pct>0</span><span class="u">%</span></b><small>사용</small></div>
      </div>
    </div>
    <div class="foot"><p class="pill" data-pill></p><p class="daily" data-daily></p></div>
    <p class="kinds-line" data-kinds></p>
  </section>
</div>
<script>
  const won = (v) => Math.round(v).toLocaleString("ko-KR");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  // ease-out, ease-value 토큰과 같은 모양의 곡선 (숫자와 끝 점을 호와 같은 박자로 움직이려고 JS 로 그린다)
  const easeOut = (t) => 1 - Math.pow(1 - t, 4);
  const easeValue = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const ICON = {
    good: '<polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/>',
    warn: '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
    bad: '<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',
  };
  const KIND = { card: "카드", cash: "현금", transfer: "계좌이체" };
  // 10월 25일 – 11월 24일(31일) 중 오늘까지 11일, 남은 날 21일
  const DAYS = 31, PASSED = 11, LEFT_DAYS = 21;
  const cards = [
    {
      el: document.getElementById("lead"), budget: 1400000, kinds: { card: 344800, cash: 45200, transfer: 0 }, lead: true,
      // 반원: 왼쪽 끝(0)에서 위를 지나 오른쪽 끝(1)까지
      at: (p) => { const a = Math.PI * (1 - p); return [150 + 124 * Math.cos(a), 148 - 124 * Math.sin(a)]; },
    },
    {
      el: document.getElementById("mini"), budget: 400000, kinds: { card: 120000, cash: 34300, transfer: 0 }, lead: false,
      // 270°: 왼쪽 아래(0)에서 위를 지나 오른쪽 아래(1)까지
      at: (p) => { const a = ((135 + 270 * p) * Math.PI) / 180; return [46 + 38 * Math.cos(a), 46 + 38 * Math.sin(a)]; },
    },
  ];
  const q = (c, k) => c.el.querySelector(`[data-${k}]`);
  const spentOf = (c) => c.kinds.card + c.kinds.cash + c.kinds.transfer;
  const place = (el, [x, y]) => { el.setAttribute("cx", x.toFixed(2)); el.setAttribute("cy", y.toFixed(2)); };

  // 한 프레임: 호, 끝 점, 퍼센트, 남은 돈이 같은 값으로 움직인다
  const frame = (c, v) => {
    const r = Math.min(1, v / c.budget);
    const fill = q(c, "fill"), lg = fill.querySelector("linearGradient"), [gx, gy] = c.at(Math.max(r, 0.02));
    fill.style.setProperty("--off", String(100 - r * 100));
    lg.setAttribute("x2", gx.toFixed(2));
    lg.setAttribute("y2", gy.toFixed(2));
    place(q(c, "knob"), c.at(r));
    q(c, "pct").textContent = String(Math.round((v / c.budget) * 100));
    q(c, "left").textContent = won(Math.abs(c.budget - v));
    c.el.classList.toggle("over", v > c.budget);
    q(c, "cap").textContent = v > c.budget ? "예산 초과" : "남은 돈";
  };

  // 글 줄: 사용 줄, 속도 알약, 하루 금액, 결제 수단, 오늘 이정표
  const words = (c) => {
    const spent = spentOf(c), pace = Math.round((c.budget * PASSED) / DAYS), left = c.budget - spent, diff = spent - pace;
    const kind = spent > c.budget ? "bad" : diff > 0 ? "warn" : "good";
    q(c, "sub").textContent = `${won(c.budget)}원 중 ${won(spent)}원 썼어요`;
    const pill = q(c, "pill");
    pill.className = `pill ${kind}`;
    pill.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[kind]}</svg>` +
      (kind === "bad" ? `예산을 ${won(-left)}원 넘었어요` : `예상보다 ${won(Math.abs(diff))}원 ${diff > 0 ? "더" : "덜"} 썼어요`);
    const per = Math.floor(left / LEFT_DAYS);
    q(c, "daily").innerHTML = left <= 0 ? "이번 달 예산을 다 썼어요"
      : c.lead ? `남은 ${LEFT_DAYS}일, 하루 <b>${won(per)}원</b>씩 쓸 수 있어요` : `하루 <b>${won(per)}원</b>`;
    const entries = Object.entries(c.kinds).filter(([, v]) => v > 0);
    const sum = entries.reduce((a, [, v]) => a + v, 0) || 1;
    if (c.lead) q(c, "kinds").innerHTML = `<div class="bar" aria-hidden="true">${entries.map(([k, v]) => `<i class="k-${k}" style="flex-grow:${v}"></i>`).join("")}</div><ul>${entries.map(([k, v]) => `<li class="k-${k}"><i></i><span class="n">${KIND[k]}<span class="v">${Math.round((v / sum) * 100)}%</span></span><b>${won(v)}원</b></li>`).join("")}</ul>`;
    else q(c, "kinds").textContent = entries.map(([k, v]) => `${KIND[k]} ${won(v)}원`).join(" · ");
    const p = Math.min(1, pace / c.budget);
    place(q(c, "mile"), c.at(p));
    if (c.lead) q(c, "mile-t").setAttribute("startOffset", `${(p * 100).toFixed(1)}%`);
    q(c, "svg").setAttribute("aria-label", `예산의 ${Math.round((spent / c.budget) * 100)}% 사용, 오늘까지 예상 ${Math.round(p * 100)}%`);
  };

  // 지금 보이는 값에서 새 값으로 이어 간다 (중간에 또 바뀌면 그 자리에서 다시 출발)
  const run = (c, to, ms, ease) => {
    const from = c.now ?? 0, t0 = performance.now();
    c.target = to;
    const step = (t) => {
      if (c.target !== to) return;
      const p = reduce ? 1 : Math.min(1, (t - t0) / ms);
      c.now = from + (to - from) * ease(p);
      frame(c, c.now);
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };

  for (const c of cards) { frame(c, 0); words(c); }
  requestAnimationFrame(() => cards.forEach((c) => run(c, spentOf(c), 1100, easeOut)));
  document.getElementById("add").addEventListener("click", () => {
    const c = cards[0];
    c.kinds.card += 32000;
    words(c);
    run(c, spentOf(c), 800, easeValue);
  });
</script>
