<!-- @dsCard group="Cards" height=720 subtitle="남은 돈이 가장 크고, 그 아래 예산 대비 막대(검은 눈금 = 오늘까지 써도 되는 선), 그다음 상태와 설명. 큰 카드와 작은 카드는 같은 모양" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&family=Noto+Sans+KR:wght@400..800&display=swap">
<style>
  body { margin: 0; background: var(--ground); color: var(--text); font-family: var(--font-text); word-break: keep-all; -webkit-font-smoothing: antialiased; }
  .stage { display: grid; gap: 12px; max-width: 420px; padding: 20px; }
  .card { padding: 22px 24px; border-radius: var(--radius-card); background: var(--surface-card); box-shadow: var(--shadow-card); }
  .head { display: flex; justify-content: space-between; align-items: baseline; font: 700 20px/28px var(--font-text); letter-spacing: -0.02em; }
  .head a { color: var(--faint); font: 500 14.5px var(--font-text); text-decoration: none; }
  .cap { margin: 10px 0 0; color: var(--faint); font: 500 14.5px/20px var(--font-text); }
  .fig { margin: 0; font: 700 36px/42px var(--font-display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .fig .won { margin-left: 2px; color: var(--faint); font-size: 0.62em; font-weight: 600; }
  .compact .fig { font-size: 28px; line-height: 34px; }
  .meter { position: relative; height: 10px; margin: 12px 0 8px; }
  .lead .meter { margin-top: 26px; }
  .track { position: absolute; inset: 0; overflow: hidden; border-radius: 999px; background: var(--well); }
  .fill { position: absolute; inset: 0; border-radius: inherit; background: var(--accent); }
  .over .fill { background: var(--negative); }
  .mile { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--text); }
  .mile span { position: absolute; bottom: calc(100% + 2px); left: 50%; transform: translateX(-50%); color: var(--faint); font: 600 11px/14px var(--font-text); white-space: nowrap; }
  .used { margin: 0; color: var(--muted); font: 500 14.5px/20px var(--font-text); }
  .foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; margin-top: 12px; color: var(--muted); font: 500 14.5px/20px var(--font-text); }
  .pill { display: inline-flex; height: 30px; padding: 0 12px; border-radius: 999px; font: 600 14px/30px var(--font-text); }
  .good { background: var(--pill-positive-bg); color: var(--pill-positive-ink); }
  .bad { background: var(--pill-negative-bg); color: var(--pill-negative-ink); }
  .over .fig { color: var(--negative); }
</style>
<div class="stage">
  <section class="card lead">
    <div class="head">남은 공동 생활비<a href="#">가계부 ›</a></div>
    <p class="cap">남은 돈</p>
    <p class="fig">804,900<span class="won">원</span></p>
    <div class="meter"><i class="track"><i class="fill" style="transform: translateX(-57%)"></i></i><i class="mile" style="left:53%"><span>오늘</span></i></div>
    <p class="used">1,400,000원 중 595,100원 썼어요 · 43%</p>
    <div class="foot"><span class="pill good">예상보다 172,642원 덜 썼어요</span><span>남은 15일, 하루 <b>53,660원</b>씩 쓸 수 있어요</span></div>
  </section>
  <section class="card compact">
    <div class="head">현빈 용돈<a href="#">플랜 ›</a></div>
    <p class="cap">남은 돈</p>
    <p class="fig">246,200<span class="won">원</span></p>
    <div class="meter"><i class="track"><i class="fill" style="transform: translateX(-62%)"></i></i><i class="mile" style="left:53%"></i></div>
    <p class="used">400,000원 중 153,800원 썼어요 · 38%</p>
    <div class="foot"><span class="pill good">예상보다 65,555원 덜 썼어요</span><span>하루 <b>16,413원</b></span></div>
  </section>
  <section class="card compact over">
    <div class="head">예진 용돈<a href="#">플랜 ›</a></div>
    <p class="cap">예산 초과</p>
    <p class="fig">32,000<span class="won">원</span></p>
    <div class="meter"><i class="track"><i class="fill" style="transform: translateX(0%)"></i></i><i class="mile" style="left:53%"></i></div>
    <p class="used">400,000원 중 432,000원 썼어요 · 108%</p>
    <div class="foot"><span class="pill bad">예산을 32,000원 넘었어요</span><span>이번 달 예산을 다 썼어요</span></div>
  </section>
</div>
