<!-- @dsCard group="Moments" height=830 subtitle="로그인: 따뜻한 무대 위 지붕과 두 동전, 반가운 인사, 아래쪽 버튼 — 위 탭으로 '등록 안 된 계정' 화면도 보세요" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&family=Noto+Sans+KR:wght@400..800&display=swap">
<style>
  body { margin: 0; background: var(--ground); color: var(--text); font-family: var(--font-text); word-break: keep-all; -webkit-font-smoothing: antialiased; }
  p { margin: 0; }
  .stage { display: grid; gap: 12px; max-width: 390px; padding: 20px; box-sizing: border-box; }
  .demo { display: flex; gap: 4px; justify-self: center; padding: 4px; border-radius: var(--radius-chip); background: var(--well); }
  .demo button { height: 30px; padding: 0 12px; border: 0; border-radius: var(--radius-chip); background: none; color: var(--muted); font: 600 13.5px/30px var(--font-text); cursor: pointer; }
  .demo button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-raise); }
  .demo button:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .screen { position: relative; display: flex; flex-direction: column; height: 740px; overflow: hidden; border-radius: var(--radius-card); background: radial-gradient(130% 70% at 50% 32%, color-mix(in srgb, var(--warm-50) 35%, var(--surface)) 0%, var(--warm-50) 40%, var(--warm-100) 100%); box-shadow: var(--shadow-card); }

  .scene { position: relative; flex: none; height: 330px; margin-top: 70px; }
  .brand { position: absolute; left: 50%; top: 20px; width: 174px; margin-left: -87px; animation: bob var(--dur-breathe) var(--ease-breathe) infinite; }
  .roof { display: block; width: 124px; margin: 0 auto 12px; overflow: visible; }
  .roof polyline { fill: none; stroke: var(--primary); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 6px 8px color-mix(in srgb, var(--primary) 28%, transparent)); }
  .pair { position: relative; height: 104px; }
  .coin { position: absolute; top: 0; width: 104px; height: 104px; border-radius: 50%; }
  .coin.a { --p: var(--a); --q: var(--a-ink); left: 0; }
  .coin.b { --p: var(--b); --q: var(--b-ink); left: 70px; overflow: hidden; }
  .coin.a, .coin.b {
    background: radial-gradient(circle at 34% 30%, color-mix(in srgb, var(--p) 22%, var(--surface)) 0%, color-mix(in srgb, var(--p) 58%, var(--surface)) 42%, color-mix(in srgb, var(--p) 88%, var(--surface)) 100%);
    box-shadow: inset -8px -12px 20px color-mix(in srgb, var(--q) 14%, transparent), 0 16px 26px -12px color-mix(in srgb, var(--p) 60%, transparent);
  }
  .lens { position: absolute; top: 0; left: -70px; width: 104px; height: 104px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, var(--surface) 55%, color-mix(in srgb, var(--b) 10%, var(--surface)) 100%); }
  .floor { position: absolute; left: 50%; top: 200px; width: 176px; height: 22px; margin-left: -88px; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--text) 15%, transparent), transparent); animation: shade var(--dur-breathe) var(--ease-breathe) infinite; }
  .obj { position: absolute; border-radius: 50%; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--g-allowance) 22%, var(--surface)) 0%, color-mix(in srgb, var(--g-allowance) 70%, var(--surface)) 40%, var(--g-allowance) 78%, color-mix(in srgb, var(--g-allowance) 70%, var(--warning)) 100%); box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--surface) 30%, transparent); }
  .obj.far { left: -24px; top: 40px; width: 80px; height: 80px; filter: blur(5px); opacity: .8; }
  .obj.near { right: 36px; top: 196px; width: 32px; height: 32px; transform: rotate(-20deg) scaleX(.78); }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes shade { 0%, 100% { transform: scaleX(1); opacity: 1; } 50% { transform: scaleX(.88); opacity: .7; } }

  .copy { display: grid; justify-items: center; gap: 12px; padding: 0 28px; text-align: center; }
  h2 { margin: 0; font: 700 28px/34px var(--font-text); letter-spacing: -0.02em; }
  .copy p { color: var(--muted); font: 400 17px/26px var(--font-text); text-wrap: balance; }
  .copy .mail { color: var(--text); font-weight: 600; }

  .actions { display: grid; gap: 12px; margin-top: auto; padding: 0 var(--edge) 30px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: var(--control-height); border: 0; border-radius: var(--radius-control); font: 600 17px/1 var(--font-text); cursor: pointer; transition: transform var(--dur-press) var(--ease-press), background-color var(--dur-press) var(--ease-out); }
  .btn:active { transform: scale(.96); }
  .btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .btn.primary { background: var(--primary); color: var(--on-primary); }
  .btn.primary:active { background: var(--primary-press); }
  .btn.secondary { background: var(--surface); color: var(--accent-ink); box-shadow: var(--shadow-card); }
  .fine { color: var(--faint); font: 500 12.5px/16px var(--font-text); text-align: center; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .brand, .floor { animation: none; } .btn { transition: none; } }
</style>
<div class="stage">
  <div class="demo" role="group" aria-label="미리보기 상태">
    <button type="button" data-v="in" aria-pressed="true">처음</button>
    <button type="button" data-v="no" aria-pressed="false">등록 안 된 계정</button>
  </div>
  <main class="screen">
    <div class="scene" aria-hidden="true">
      <span class="obj far"></span>
      <span class="obj near"></span>
      <span class="floor"></span>
      <div class="brand">
        <svg class="roof" viewBox="0 0 124 48"><polyline points="12 40 62 10 112 40"/></svg>
        <div class="pair"><span class="coin a"></span><span class="coin b"><span class="lens"></span></span></div>
      </div>
    </div>
    <div class="copy" data-v="in">
      <h2>반가워요!</h2>
      <p>우리 집 가계부에서 두 사람의 한 달 돈을 함께 챙겨요</p>
    </div>
    <div class="copy" data-v="no" hidden>
      <h2>등록되지 않은 계정이에요</h2>
      <p><span class="mail">someone@example.com</span> 계정은 이 가계부에 연결되어 있지 않아요</p>
    </div>
    <div class="actions" data-v="in">
      <button type="button" class="btn primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></svg>구글 계정으로 로그인</button>
      <p class="fine">등록된 두 사람의 구글 계정만 들어올 수 있어요</p>
    </div>
    <div class="actions" data-v="no" hidden>
      <button type="button" class="btn secondary">다른 계정으로 로그인</button>
      <p class="fine">멤버로 등록된 구글 계정으로 다시 로그인해 주세요</p>
    </div>
  </main>
</div>
<script>
  const demo = document.querySelector(".demo");
  demo.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    for (const x of demo.children) x.setAttribute("aria-pressed", String(x === b));
    document.querySelectorAll(".screen [data-v]").forEach((el) => (el.hidden = el.dataset.v !== b.dataset.v));
  });
</script>
