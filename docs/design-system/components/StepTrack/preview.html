<!-- @dsCard group="Cards" height=210 subtitle="칸 나눈 진행 막대: 끝낸 칸은 accent, 남은 칸은 well" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&family=Noto+Sans+KR:wght@400..800&display=swap">
<style>
  body { margin: 0; background: var(--ground); color: var(--text); font-family: var(--font-text); word-break: keep-all; -webkit-font-smoothing: antialiased; }
  .stage { padding: 20px; }
  .label { max-width: 390px; margin: 0 0 10px; color: var(--faint); font: 500 14.5px/20px var(--font-text); }
  .card { max-width: 390px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px 12px; padding: 18px 20px; box-sizing: border-box; background: var(--surface); border-radius: var(--radius-card); box-shadow: var(--shadow-card); }
  .card h3 { margin: 0; font: 600 17px/24px var(--font-text); letter-spacing: -0.01em; }
  .meta { display: flex; align-items: center; gap: 6px; color: var(--faint); font: 500 12.5px/16px var(--font-text); }
  .meta b { color: var(--muted); font-family: var(--font-display); font-weight: 600; }
  svg.i { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .chev { grid-row: 1 / span 4; grid-column: 2; width: 20px; height: 20px; color: var(--faint); }
  .track { display: flex; gap: 4px; height: 8px; margin: 4px 0 2px; }
  .track i { flex: 1; border-radius: var(--radius-chip); background: var(--well); }
  .track i.done { background: var(--accent); }
</style>
<div class="stage">
  <p class="label">이번 달 할 일</p>
  <section class="card" aria-label="11월 옮길 돈">
    <h3>11월 옮길 돈</h3>
    <svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    <div class="meta"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg><b>3 / 6</b>건 옮김</div>
    <div class="track" role="img" aria-label="6건 중 3건 끝남">
      <i class="done"></i><i class="done"></i><i class="done"></i><i></i><i></i><i></i>
    </div>
    <div class="meta"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>예진 월급날까지 6일 · 남은 3건 1,415,000원</div>
  </section>
</div>
