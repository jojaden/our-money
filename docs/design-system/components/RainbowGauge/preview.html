<!-- @dsCard group="Cards" height=700 subtitle="가계부 머리: 쓴 돈 버킷 두 겹(생활비·용돈)을 빛을 머금은 튜브로 겹친 반원과 흰 바탕으로 스며드는 하늘 — '하루 지나기'로 값이 이어지는 모습을 보세요" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&family=Noto+Sans+KR:wght@400..800&display=swap">
<style>
  body { margin: 0; background: var(--ground); color: var(--text); font-family: var(--font-text); word-break: keep-all; -webkit-font-smoothing: antialiased; }
  p { margin: 0; }
  .stage { padding: 20px; }
  .card { max-width: 390px; overflow: hidden; background: var(--surface); border-radius: var(--radius-card); box-shadow: var(--shadow-card); }
  .sky { position: relative; padding: 22px 0 4px; background: linear-gradient(180deg, var(--sky-100) 0%, var(--glow) 55%, var(--surface) 100%); }
  .act { position: absolute; top: 12px; right: 12px; z-index: 1; height: 32px; padding: 0 13px; border: 0; border-radius: var(--radius-chip); background: color-mix(in srgb, var(--surface) 72%, transparent); color: var(--accent-ink); font: 600 14px/32px var(--font-text); cursor: pointer; transition: transform var(--dur-press) var(--ease-press); }
  .act:active { transform: scale(.96); }
  .act:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .arch { position: relative; width: min(100% - 40px, 320px); margin: 0 auto; filter: drop-shadow(0 6px 10px color-mix(in srgb, var(--accent-ink) 10%, transparent)); }
  .arch svg { display: block; width: 100%; overflow: visible; }
  .arch path { fill: none; stroke-linecap: round; }
  /* 빈자리: 흰 라일락 튜브 / 채운 호: 옅은 시작 → 진한 끝 + 굵기 방향 반투명 입체 + 둘레 빛 */
  .tk-edge { stop-color: color-mix(in srgb, var(--lilac) 82%, var(--muted)); }
  .tk-body { stop-color: color-mix(in srgb, var(--lilac) 45%, var(--surface)); }
  .tk-light { stop-color: var(--surface); }
  .tk-rim { stop-color: color-mix(in srgb, var(--lilac) 88%, var(--muted)); }
  .lg-from { stop-color: color-mix(in srgb, var(--c) 46%, var(--surface)); }
  .lg-to { stop-color: var(--c); }
  .vo-shade { stop-color: var(--text); }
  .vo-light { stop-color: var(--surface); }
  .fl path { stroke-dasharray: 100 100; }
  .fl .halo { opacity: .45; filter: blur(5px); }
  .knob { fill: var(--surface); filter: drop-shadow(0 1px 2px color-mix(in srgb, var(--text) 25%, transparent)); }
  .living { --c: var(--g-living); } .allowance { --c: var(--g-allowance); }
  .mid { position: absolute; left: 0; right: 0; bottom: 4px; display: grid; justify-items: center; }
  .mid b { font: 800 40px/42px var(--font-display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .mid b .u { margin-left: 1px; font-size: .5em; font-weight: 700; color: var(--faint); }
  .mid small { color: var(--faint); font: 600 12.5px/16px var(--font-text); }

  .panel { display: grid; justify-items: center; gap: 2px; padding: 10px var(--pad) var(--pad); text-align: center; }
  .cap { color: var(--faint); font: 500 14.5px/20px var(--font-text); }
  .fig { font: 700 36px/42px var(--font-display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .fig .won { margin-left: 2px; font-size: .62em; font-weight: 600; color: var(--faint); }
  .pace { display: inline-flex; align-items: center; gap: 6px; height: 30px; margin-top: 14px; padding: 0 12px; border-radius: var(--radius-chip); background: var(--pill-positive-bg); color: var(--pill-positive-ink); font: 600 14px/30px var(--font-text); }
  .pace svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .rows { width: 100%; margin-top: 16px; text-align: left; }
  .row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 0; }
  .row + .row { background: linear-gradient(var(--rule), var(--rule)) 22px 0 / calc(100% - 22px) .6px no-repeat; }
  .row i { width: 10px; height: 10px; border-radius: var(--radius-chip); background: var(--c); }
  .row .n { font: 500 16px/24px var(--font-text); letter-spacing: -0.01em; }
  .row .v { color: var(--faint); font: 500 12.5px/16px var(--font-text); font-variant-numeric: tabular-nums; }
  .row .p { font: 600 17px/24px var(--font-display); font-variant-numeric: tabular-nums; }
  .row .p.over { color: var(--negative); }
  @media (prefers-reduced-motion: reduce) { .act { transition: none; } }
</style>
<div class="stage">
  <section class="card" aria-label="이번 달 쓴 돈">
    <div class="sky">
      <button type="button" class="act" id="next">하루 지나기</button>
      <div class="arch" id="arch" role="img">
        <div class="mid" aria-hidden="true"><b><span id="pct">0</span><span class="u">%</span></b><small>예산 사용</small></div>
      </div>
    </div>
    <div class="panel">
      <p class="cap">이번 달 쓴 돈</p>
      <p class="fig"><span id="total">0</span><span class="won">원</span></p>
      <p class="cap" id="of"></p>
      <p class="pace"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 17h6v-6"/><path d="m22 17-8.5-8.5-5 5L2 7"/></svg>생활비를 지난달 이맘때보다 10% 덜 썼어요</p>
      <div class="rows" id="rows"></div>
    </div>
  </section>
</div>
<script>
  // 두 겹: 바깥 생활비(반지름 136), 안쪽 용돈(113). 선 18px, 호 사이 5px, 같은 중심
  const B = [
    { k: "living", n: "공동 생활비", r: 136, budget: 1400000, used: 390000 },
    { k: "allowance", n: "두 사람 용돈", r: 113, budget: 800000, used: 194300, note: (u) => `현빈 ${won(u * 0.62)} · 예진 ${won(u * 0.38)}` },
  ];
  const CX = 160, CY = 156, W = 18;
  const won = (v) => Math.round(v).toLocaleString("ko-KR");
  const at = (r, p) => { const a = Math.PI * (1 - p); return [CX + r * Math.cos(a), CY - r * Math.sin(a)]; };
  const arch = document.getElementById("arch");
  arch.insertAdjacentHTML("afterbegin", B.map((b, i) => {
    const d = `M${CX - b.r} ${CY} A${b.r} ${b.r} 0 0 1 ${CX + b.r} ${CY}`;
    const inR = b.r - W / 2, outR = b.r + W / 2, o = (f) => ((inR + W * f) / outR).toFixed(4);
    const rad = `gradientUnits="userSpaceOnUse" cx="${CX}" cy="${CY}" r="${outR}"`;
    const [sx, sy] = at(b.r, 0);
    return `<svg class="${b.k}" viewBox="0 0 320 168" aria-hidden="true" style="${i ? "position:absolute;inset:0" : ""}"><defs>
      <radialGradient id="k${i}" ${rad}><stop offset="${o(0)}" class="tk-edge"/><stop offset="${o(.3)}" class="tk-body"/><stop offset="${o(.6)}" class="tk-light"/><stop offset="${o(.84)}" class="tk-body"/><stop offset="1" class="tk-rim"/></radialGradient>
      <radialGradient id="v${i}" ${rad}><stop offset="${o(0)}" class="vo-shade" stop-opacity=".22"/><stop offset="${o(.3)}" class="vo-shade" stop-opacity="0"/><stop offset="${o(.6)}" class="vo-light" stop-opacity=".32"/><stop offset="${o(.84)}" class="vo-light" stop-opacity="0"/><stop offset="1" class="vo-shade" stop-opacity=".14"/></radialGradient>
      <linearGradient id="l${i}" gradientUnits="userSpaceOnUse" x1="${sx}" y1="${sy}" x2="${sx}" y2="${sy}"><stop offset="0" class="lg-from"/><stop offset="1" class="lg-to"/></linearGradient></defs>
      <path stroke="url(#k${i})" stroke-width="${W}" d="${d}"/>
      <g class="fl" id="f${i}"><path class="halo" stroke="url(#l${i})" stroke-width="${W + 6}" pathLength="100" d="${d}"/><path stroke="url(#l${i})" stroke-width="${W}" pathLength="100" d="${d}"/><path stroke="url(#v${i})" stroke-width="${W}" pathLength="100" d="${d}"/></g>
      <circle class="knob" id="n${i}" r="5"/></svg>`;
  }).join(""));
  document.getElementById("rows").innerHTML = B.map((b, i) =>
    `<div class="row ${b.k}"><i></i><div><p class="n">${b.n}</p><p class="v" id="rv${i}"></p>${b.note ? `<p class="v" id="rt${i}"></p>` : ""}</div><b class="p" id="rp${i}"></b></div>`).join("");

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const budget = B.reduce((a, b) => a + b.budget, 0);
  let shown = B.map(() => 0);
  // 호·끝 점·그라데이션 끝·가운데 %·금액을 한 값으로 같은 박자에
  const draw = (v) => {
    v.forEach((x, i) => {
      const p = Math.min(1, x / B[i].budget), [kx, ky] = at(B[i].r, p), [gx, gy] = at(B[i].r, Math.max(p, .02));
      document.querySelectorAll(`#f${i} path`).forEach((el) => (el.style.strokeDashoffset = String(100 - p * 100)));
      const lg = document.getElementById(`l${i}`); lg.setAttribute("x2", gx.toFixed(2)); lg.setAttribute("y2", gy.toFixed(2));
      const n = document.getElementById(`n${i}`); n.setAttribute("cx", kx.toFixed(2)); n.setAttribute("cy", ky.toFixed(2));
    });
    const total = v.reduce((a, x) => a + x, 0);
    document.getElementById("total").textContent = won(total);
    document.getElementById("pct").textContent = String(Math.round((total / budget) * 100));
  };
  const tween = (ms, ease) => {
    const from = shown, to = B.map((b) => b.used), t0 = performance.now();
    const step = (t) => {
      const p = reduce ? 1 : Math.min(1, (t - t0) / ms), e = ease(p);
      shown = from.map((f, i) => f + (to[i] - f) * e);
      draw(shown);
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };
  const rows = () => B.forEach((b, i) => {
    const pct = Math.round((b.used / b.budget) * 100);
    document.getElementById(`rv${i}`).textContent = `${won(b.used)} / ${won(b.budget)}원`;
    if (b.note) document.getElementById(`rt${i}`).textContent = b.note(b.used);
    const el = document.getElementById(`rp${i}`); el.textContent = pct + "%"; el.classList.toggle("over", pct > 100);
    arch.setAttribute("aria-label", B.map((x) => `${x.n} ${Math.round((x.used / x.budget) * 100)}%`).join(", "));
  });
  document.getElementById("of").textContent = `예산 ${won(budget)}원`;
  rows();
  // 처음: 0에서 dur-ring·ease-out / 그다음: 이전 값에서 dur-value·ease-value
  tween(1100, (t) => 1 - Math.pow(1 - t, 4));
  document.getElementById("next").addEventListener("click", () => {
    B[0].used += 48000 + Math.round(Math.random() * 40000);
    B[1].used += 12000 + Math.round(Math.random() * 20000);
    rows();
    tween(800, (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2));
  });
</script>
