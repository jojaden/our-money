<!-- @dsCard group="Moments" height=600 subtitle="체크 100%: 빛이 피고 → 숫자가 튀며 구슬이 터지고 → 해낸 일이 차례로 뜸 — 다시 보기를 눌러 보세요" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&family=Noto+Sans+KR:wght@400..800&display=swap">
<style>
  body { margin: 0; background: var(--ground); color: var(--text); font-family: var(--font-text); word-break: keep-all; -webkit-font-smoothing: antialiased; }
  .stage { padding: 20px; }
  .screen { position: relative; max-width: 390px; height: 560px; overflow: hidden; border-radius: var(--radius-card); background: radial-gradient(120% 85% at 50% 32%, var(--glow) 0%, var(--accent-soft) 42%, var(--lilac) 100%); box-shadow: var(--shadow-card); }
  .bloom { position: absolute; inset: 0; background: radial-gradient(55% 40% at 50% 170px, var(--surface) 0%, transparent 70%); opacity: .9; }
  .rays { position: absolute; left: 50%; top: 170px; width: 900px; height: 900px; margin: -450px 0 0 -450px; background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--surface) 90%, transparent) 0deg 12deg, transparent 12deg 36deg); filter: blur(26px); opacity: .6; -webkit-mask: radial-gradient(circle, #000 0 18%, transparent 55%); mask: radial-gradient(circle, #000 0 18%, transparent 55%); animation: spin var(--dur-rays) linear infinite; }
  .spark { position: absolute; left: 50%; top: 170px; width: 14px; height: 14px; margin: -7px; border-radius: var(--radius-chip); background: var(--surface); box-shadow: 0 0 18px 8px color-mix(in srgb, var(--surface) 80%, transparent), 0 0 40px 16px color-mix(in srgb, var(--primary) 22%, transparent); opacity: 0; }
  .bead { position: absolute; left: 50%; top: 170px; width: 14px; height: 14px; margin: -7px; border-radius: var(--radius-chip); background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--primary) 30%, var(--surface)) 0 18%, var(--primary) 55%, var(--primary-press) 100%); opacity: 0; pointer-events: none; }
  .center { position: absolute; left: 0; right: 0; top: 110px; display: grid; justify-items: center; gap: 14px; text-align: center; }
  .num { font: 800 120px/1 var(--font-display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; background: linear-gradient(180deg, color-mix(in srgb, var(--primary) 68%, var(--surface)) 0%, var(--primary) 46%, color-mix(in srgb, var(--primary) 72%, var(--primary-press)) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 5px 0 color-mix(in srgb, var(--primary-press) 30%, transparent)) drop-shadow(0 18px 24px color-mix(in srgb, var(--primary) 26%, transparent)); }
  .num small { font-size: .5em; letter-spacing: 0; }
  h2 { margin: 0; font: 700 26px/32px var(--font-text); letter-spacing: -0.02em; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 320px; }
  .chips span { height: 28px; padding: 0 12px; border-radius: var(--radius-chip); background: color-mix(in srgb, var(--surface) 75%, transparent); color: var(--muted); font: 600 12.5px/28px var(--font-text); }
  .chips b { color: var(--accent-ink); font-family: var(--font-display); }
  .next { position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 12px; padding: 20px; border-radius: var(--radius-card); background: var(--surface); box-shadow: var(--shadow-card); }
  .next div { flex: 1; min-width: 0; }
  .next strong { display: block; font: 700 18px/26px var(--font-text); }
  .next span { color: var(--faint); font: 400 14.5px/20px var(--font-text); }
  .next svg { flex: none; width: 22px; height: 22px; fill: none; stroke: var(--primary); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .replay { position: absolute; top: 14px; right: 14px; z-index: 2; height: 32px; padding: 0 12px; border: 0; border-radius: var(--radius-chip); background: color-mix(in srgb, var(--surface) 70%, transparent); color: var(--accent-ink); font: 600 13px/1 var(--font-text); cursor: pointer; }
  .replay:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* 타임라인: 0 빛이 핀다 → 300ms 숫자가 튀고 구슬이 터진다 → 650ms 제목 → 900ms부터 해낸 일 → 1500ms 다음 할 일 */
  .play .bloom { animation: bloom var(--dur-bloom) var(--ease-out) both; }
  .play .rays { animation: bloom var(--dur-bloom) var(--ease-out) both, spin var(--dur-rays) linear infinite; }
  .play .spark { animation: spark 700ms var(--ease-out) both; }
  .play .num { animation: pop var(--dur-pop) var(--ease-pop) 300ms both; }
  .play h2 { animation: rise 420ms var(--ease-out) 650ms both; }
  .play .chips span { animation: rise 360ms var(--ease-out) both; }
  .play .chips span:nth-child(1) { animation-delay: 900ms; }
  .play .chips span:nth-child(2) { animation-delay: 1050ms; }
  .play .chips span:nth-child(3) { animation-delay: 1200ms; }
  .play .next { animation: rise 520ms var(--ease-out) 1500ms both; }
  .play .bead { animation: burst 1100ms var(--ease-out) var(--d) both; }
  @keyframes bloom { from { scale: .7; opacity: 0; } }
  @keyframes spin { to { transform: rotate(1turn); } }
  @keyframes spark { 0% { opacity: 0; scale: .2; } 40% { opacity: 1; scale: 1.4; } 100% { opacity: 0; scale: 2.2; } }
  @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes rise { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes burst { 0% { transform: translate(0, 0) scale(.4); opacity: 0; } 18% { opacity: 1; } 100% { transform: translate(var(--x), var(--y)) scale(.75); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .rays, .play .bloom, .play .rays, .play .spark, .play .num, .play h2, .play .chips span, .play .next, .bead { animation: none; } .bead { display: none; } }
</style>
<div class="stage">
  <div class="screen play" role="dialog" aria-label="11월 체크 100%">
    <div class="bloom" aria-hidden="true"></div>
    <div class="rays" aria-hidden="true"></div>
    <div class="spark" aria-hidden="true"></div>
    <div id="beads" aria-hidden="true"></div>
    <button type="button" class="replay">다시 보기</button>
    <div class="center">
      <div class="num"><span id="n">100</span><small>%</small></div>
      <h2>11월 할 일을 모두 끝냈어요</h2>
      <div class="chips"><span>옮길 돈 <b>12</b>건</span><span>고정비 <b>6</b>건</span><span>저축 <b>2</b>건</span></div>
    </div>
    <div class="next">
      <div><strong>12월 플랜 미리 만들기</strong><span>이번 달 배분을 그대로 이어받아요</span></div>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </div>
  </div>
</div>
<script>
  const screen = document.querySelector(".screen");
  const n = document.getElementById("n");
  const beads = document.getElementById("beads");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const scatter = () => {
    beads.innerHTML = Array.from({ length: 16 }, (_, i) => {
      const a = (i / 16) * Math.PI * 2 + Math.random() * 0.4, r = 120 + Math.random() * 90;
      return `<i class="bead" style="--x:${Math.round(Math.cos(a) * r)}px;--y:${Math.round(Math.sin(a) * r)}px;--d:${300 + Math.round(Math.random() * 160)}ms;width:${10 + Math.round(Math.random() * 8)}px;height:auto;aspect-ratio:1"></i>`;
    }).join("");
  };
  const count = () => {
    if (reduce) { n.textContent = "100"; return; }
    n.textContent = "0";
    setTimeout(() => {
      const t0 = performance.now();
      const step = (t) => {
        const p = Math.min(1, (t - t0) / 1300);
        n.textContent = String(Math.round(100 * (1 - Math.pow(1 - p, 4))));
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }, 300);
  };
  const play = () => {
    screen.classList.remove("play");
    if (!reduce) scatter();
    void screen.offsetWidth;
    screen.classList.add("play");
    count();
  };
  document.querySelector(".replay").addEventListener("click", play);
  play();
</script>
