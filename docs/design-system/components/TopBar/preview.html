<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&family=Noto+Sans+KR:wght@400..800&display=swap">
<style>
  body { margin: 0; background: var(--ground); color: var(--text); font-family: var(--font-text); word-break: keep-all; -webkit-font-smoothing: antialiased; }
  .stage { padding: 20px; }
  .band { max-width: 390px; padding: 6px calc(var(--edge) + var(--text-inset)) 20px; box-sizing: border-box; border-radius: var(--radius-card); background: linear-gradient(180deg, var(--warm-100) 0%, var(--warm-50) 62%, var(--ground) 100%); }
  .plain, .glass { max-width: 390px; box-sizing: border-box; padding: 6px calc(var(--edge) + var(--text-inset)) 16px; }
  .bar { display: flex; align-items: center; gap: 6px; }
  .month { display: inline-flex; align-items: center; height: var(--topbar-btn); margin-left: -6px; padding: 0 6px; border: 0; border-radius: var(--radius-control); background: transparent; color: var(--text); font: 700 26px/32px var(--font-display); letter-spacing: -0.02em; cursor: pointer; transition: transform var(--dur-press) var(--ease-press); }
  .now { height: 32px; padding: 0 12px; border: 0; border-radius: var(--radius-chip); background: var(--tab-active-bg); color: var(--text); font: 600 13.5px/1 var(--font-text); cursor: pointer; transition: transform var(--dur-press) var(--ease-press); }
  .month:active, .now:active, .sq:active { transform: scale(0.94); }
  .actions { display: flex; margin-left: auto; margin-right: -10px; }
  .sq { display: grid; place-items: center; width: var(--topbar-btn); height: var(--topbar-btn); padding: 0; border: 0; border-radius: var(--radius-control); background: transparent; color: var(--text); cursor: pointer; transition: transform var(--dur-press) var(--ease-press); }
  .sq svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .month:focus-visible, .now:focus-visible, .sq:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sub { padding-left: 0; color: var(--faint); font: 400 14.5px/20px var(--font-text); }
  .cap { margin: 20px 0 8px; color: var(--faint); font: 500 14.5px/20px var(--font-text); }
  .glass { background: color-mix(in srgb, var(--surface) 72%, transparent); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 16px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 16px), transparent); }
</style>
<div class="stage">

        <button type="button" class="sq" aria-label="설정"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-2.82 1.17V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-2.82-1.17l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 3 12.83H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.17-2.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9.9 3.09V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 2.82 1.17l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 21 9.9V10a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
      </span>
    </div>
    <div class="sub">10월 25일 – 11월 24일 · 21일 남음</div>
  </header>

  <div class="cap">굴려서 머리가 막대 밑으로 지나가면 (유리)</div>
  <div class="bar glass">
    <button type="button" class="month" aria-haspopup="dialog" aria-label="11월, 다른 달 고르기">11월</button>
  </div>

  <div class="cap">다른 달을 볼 때 (홈 밖이라 따뜻한 띠 없음)</div>
  <div class="plain">

    <div class="sub">9월 25일 – 10월 24일 · 지난 달</div>
  </div>
</div>
