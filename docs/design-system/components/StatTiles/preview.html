<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&family=Noto+Sans+KR:wght@400..800&display=swap">
<style>
  body { margin: 0; background: var(--ground); color: var(--text); font-family: var(--font-text); word-break: keep-all; -webkit-font-smoothing: antialiased; }
  .stage { padding: 20px; }
  .label { max-width: 390px; margin: 0 0 10px; color: var(--faint); font: 500 14.5px/20px var(--font-text); }
  .grid { max-width: 390px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 14px; border-radius: var(--radius-inner); background: var(--surface); box-shadow: var(--shadow-card); }
  .ic { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: var(--radius-chip); }
  .ic svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .t1 { background: var(--pill-negative-bg); color: var(--pill-negative-ink); }
  .t2 { background: var(--a-soft); color: var(--a-ink); }
  .t3 { background: var(--accent-soft); color: var(--accent-ink); }
  .t4 { background: var(--pill-positive-bg); color: var(--pill-positive-ink); }
  .tile div { min-width: 0; }
  .tile b { display: block; font: 700 18px/24px var(--font-display); letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .tile b span { margin-left: 1px; font-size: .72em; font-weight: 600; color: var(--faint); }
  .tile small { display: block; color: var(--faint); font: 500 12.5px/16px var(--font-text); }
</style>
