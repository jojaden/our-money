<!-- @dsCard group="Cards" height=560 subtitle="비었을 때(다음 행동 버튼) · 불러오기 실패(다시 시도) · 불러오는 동안(줄 모양 자리)" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&family=Noto+Sans+KR:wght@400..800&display=swap">
<style>
  body { margin: 0; background: var(--ground); color: var(--text); font-family: var(--font-text); word-break: keep-all; -webkit-font-smoothing: antialiased; }
  .stage { display: grid; gap: 12px; max-width: 390px; padding: 16px 20px 20px; }
  .card { padding: 18px 20px 20px; border-radius: var(--radius-card); background: var(--surface-card); box-shadow: var(--shadow-card); }
  .card h2 { margin: 0 0 12px; font: 700 19px/26px var(--font-text); }
  .empty { padding: 14px 16px; border-radius: var(--radius-inner); background: var(--raised); color: var(--muted); font-size: 14.5px; }
  .es-title { margin: 0; color: var(--text); font: 600 15px/21px var(--font-text); }
  .es-body { margin: 2px 0 0; font: 400 14px/20px var(--font-text); }
  .btn { margin-top: 12px; height: 36px; padding: 0 14px; border: 0; border-radius: var(--radius-control); background: var(--accent-soft); color: var(--accent-ink); font: 600 14px var(--font-text); }
  .error { background: var(--pill-negative-bg); color: var(--pill-negative-ink); }
  .error .es-title { color: var(--pill-negative-ink); }
  .row { display: flex; align-items: center; gap: 14px; padding: 12px 0; animation: b var(--dur-breathe) var(--ease-breathe) calc(var(--i) * 160ms) infinite; }
  .sk { display: block; border-radius: var(--radius-chip); background: var(--well); }
  .dot { flex: none; width: 36px; height: 36px; } .lines { display: grid; flex: 1; gap: 8px; } .t { width: 58%; height: 14px; } .s { width: 36%; height: 11px; }
  @keyframes b { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  @media (prefers-reduced-motion: reduce) { .row { animation: none; } }
</style>
<div class="stage">
  <section class="card"><h2>최근 기록</h2>
    <div class="empty"><p class="es-title">이번 달 기록이 아직 없어요</p><p class="es-body">쓴 돈을 적으면 여기에 최근 것부터 보여요.</p><button class="btn" type="button">지출 기록하기</button></div>
  </section>
  <section class="card"><h2>변경 이력</h2>
    <div class="empty error" role="alert"><p class="es-title">이력을 불러오지 못했어요</p><p class="es-body">인터넷 연결을 확인해 주세요.</p><button class="btn" type="button">다시 시도</button></div>
  </section>
  <section class="card"><h2>불러오는 중</h2>
    <div role="status" aria-label="변경 이력을 불러오는 중">
      <span class="row" style="--i:0"><span class="sk dot"></span><span class="lines"><span class="sk t"></span><span class="sk s"></span></span></span>
      <span class="row" style="--i:1"><span class="sk dot"></span><span class="lines"><span class="sk t"></span><span class="sk s"></span></span></span>
      <span class="row" style="--i:2"><span class="sk dot"></span><span class="lines"><span class="sk t"></span><span class="sk s"></span></span></span>
    </div>
  </section>
</div>
