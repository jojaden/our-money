<!-- @dsCard group="Navigation" height=460 subtitle="일정 줄을 꾹 누르면(또는 오른쪽 클릭) 뒤가 흐려지고 줄이 떠오르며 오른쪽 끝에 수정·복사·공유·삭제" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&family=Noto+Sans+KR:wght@400..800&display=swap">
<style>
  body { margin: 0; background: var(--ground); color: var(--text); font-family: var(--font-text); -webkit-font-smoothing: antialiased; }
  .stage { position: relative; max-width: 390px; height: 420px; margin: 20px; overflow: hidden; border-radius: var(--radius-sheet); background: var(--surface); }
  .list { padding: 20px 20px 0; }
  .list h3 { margin: 0 0 6px; color: var(--faint); font: 500 14.5px/20px var(--font-text); }
  .row { display: grid; grid-template-columns: 64px 4px 1fr; column-gap: 12px; width: 100%; min-height: 56px; margin: 0 -8px; padding: 10px 8px; border: 0; border-radius: var(--radius-small); background: transparent; color: inherit; font: inherit; text-align: left; -webkit-touch-callout: none; user-select: none; cursor: pointer; }
  .row .tm { align-self: center; font: 600 13px/18px var(--font-text); }
  .row .bar { border-radius: 2px; background: var(--a); }
  .row.j .bar { background: var(--joint); }
  .row .t { font: 600 16px/22px var(--font-text); }
  .row .s { color: var(--faint); font: 500 13px/18px var(--font-text); }
  .dim { position: absolute; inset: 0; background: color-mix(in srgb, var(--scrim) 55%, transparent); -webkit-backdrop-filter: blur(14px) saturate(140%); backdrop-filter: blur(14px) saturate(140%); opacity: 0; pointer-events: none; transition: opacity var(--dur-swap) var(--ease-out); }
  .lift { position: absolute; left: 8px; right: 8px; padding: 0 12px; border-radius: var(--radius-inner); background: var(--surface); box-shadow: var(--shadow-float); opacity: 0; pointer-events: none; transform: scale(0.96); transition: transform var(--dur-tab) var(--ease-pop), opacity 120ms ease; }
  .menu { position: absolute; right: 12px; width: 232px; overflow: hidden; border-radius: var(--radius-inner); background: color-mix(in srgb, var(--surface) 90%, transparent); box-shadow: var(--shadow-float); opacity: 0; pointer-events: none; transform: scale(0.4); transform-origin: top right; transition: transform var(--dur-tab) var(--ease-pop), opacity 160ms ease; }
  .menu button { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 48px; padding: 0 16px; border: 0; background: transparent; color: var(--text); font: 500 16px/22px var(--font-text); cursor: pointer; }
  .menu button + button { box-shadow: inset 0 0.6px 0 var(--rule); }
  .menu button.split { border-top: 6px solid var(--well); box-shadow: none; color: var(--negative); }
  .menu button:hover, .menu button:focus-visible { background: var(--well); outline: none; }
  .menu svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .on .dim { opacity: 1; pointer-events: auto; }
  .on .lift { opacity: 1; transform: scale(1); }
  .on .menu { opacity: 1; pointer-events: auto; transform: scale(1); }
  @media (prefers-reduced-motion: reduce) { .dim, .lift, .menu { transition: none; } }
</style>
<div class="stage" id="stage">
  <div class="list">
    <h3>일정</h3>
    <button type="button" class="row j" data-r><span class="tm">하루 종일</span><span class="bar"></span><span><div class="t">결혼기념일</div><div class="s">D-4</div></span></button>
    <button type="button" class="row" data-r><span class="tm">오후 7:00</span><span class="bar"></span><span><div class="t">동창 모임</div><div class="s">현빈 일정</div></span></button>
  </div>
  <div class="dim" id="dim"></div>
  <div class="lift" id="lift"></div>
  <div class="menu" id="menu" role="menu" aria-label="일정 메뉴">
    <button type="button" role="menuitem">수정<svg viewBox="0 0 24 24"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>
    <button type="button" role="menuitem">복사<svg viewBox="0 0 24 24"><rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button>
    <button type="button" role="menuitem">공유<svg viewBox="0 0 24 24"><path d="M12 2v13"/><path d="m16 6-4-4-4 4"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/></svg></button>
    <button type="button" role="menuitem" class="split">삭제<svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button>
  </div>
</div>
<script>
  // 미리보기: 줄을 0.45초 누르거나 오른쪽 클릭하면 열리고, 바깥·메뉴를 누르면 닫힌다 (실제 구현은 apps/web/src/components/HoldMenu.tsx)
  const stage = document.getElementById("stage"), lift = document.getElementById("lift"), menu = document.getElementById("menu");
  let t;
  const open = (row) => {
    const s = stage.getBoundingClientRect(), r = row.getBoundingClientRect();
    lift.innerHTML = row.outerHTML;
    lift.style.top = `${r.top - s.top}px`;
    menu.style.top = `${r.bottom - s.top + 10}px`;
    stage.classList.add("on");
    menu.querySelector("button").focus({ preventScroll: true });
  };
  const close = () => stage.classList.remove("on");
  for (const row of document.querySelectorAll("[data-r]")) {
    row.addEventListener("pointerdown", () => (t = setTimeout(() => open(row), 450)));
    for (const e of ["pointerup", "pointerleave", "pointercancel"]) row.addEventListener(e, () => clearTimeout(t));
    row.addEventListener("contextmenu", (e) => { e.preventDefault(); open(row); });
  }
  document.getElementById("dim").addEventListener("click", close);
  menu.addEventListener("click", close);
  addEventListener("keydown", (e) => e.key === "Escape" && close());
</script>
