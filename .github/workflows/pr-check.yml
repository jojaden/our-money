# PR 규칙 점검 (.github/scripts/repo_check.py pr)
#   앱이 바뀌는 파일(apps/*/src · public · 의존성 · supabase/)을 바꿨는데 CHANGELOG.md 가 그대로면 실패
#   — 사용자가 알아챌 변경이 아니면 PR 에 '변경기록 없음' 라벨을 붙인다 (붙이고 떼면 다시 돈다).
#   CHANGELOG '다음 버전'에 줄이 있는데 '**DB 이전:**' 줄이 없으면 실패 (빈 절이면 그 아래 새 버전 절에서).
#   supabase/migrations/ 에 파일을 더했는데 schema.sql 이 그대로면 실패.
name: pr-check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# 겹친 실행을 취소하지 않는다: PR 을 라벨과 함께 만들면 opened·labeled 가 동시에 와서
# 하나가 취소되고, 취소된 검사가 실패처럼 보인다. 몇 초면 끝나는 검사라 모두 끝까지 돌린다.

jobs:
  rules:
    name: PR 규칙 점검
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2          # PR 병합 커밋과 그 첫 부모(대상 브랜치)
          persist-credentials: false
      - name: 규칙 점검
        env:
          SKIP_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, '변경기록 없음') }}
        run: python3 .github/scripts/repo_check.py pr HEAD^1
