# 검사: main 에 올라오는 커밋과 모든 PR 에서.
#   secrets — 추적 파일의 비밀값·연결 정보 (scripts/secret_check.py) + 전체 커밋 기록 (gitleaks, 설정은 .gitleaks.toml)
#   web     — apps/web 정적 빌드 (타입 검사 포함, Supabase 없이 데모 모드)
#   mobile  — apps/mobile core 계산 테스트 + 안드로이드 디버그 APK
# 작업 이름(name)은 main 보호 규칙의 필수 검사라 바꾸면 규칙도 함께 고친다.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: 비밀값 검사
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # gitleaks 가 모든 커밋을 본다
          persist-credentials: false
      - name: 추적 파일 (scripts/secret_check.py)
        run: python3 scripts/secret_check.py
      - name: gitleaks 설치 (체크섬 확인)
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$file" && curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $file\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "$file" gitleaks
      - name: 전체 커밋 기록 (gitleaks)
        run: "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --no-banner --exit-code 1

  web:
    name: 웹 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: 정적 빌드 (타입 검사 포함)
        run: npx next build

  mobile:
    name: 모바일 테스트·빌드
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"
      - uses: gradle/actions/setup-gradle@v6
      - name: core 계산 테스트 · 디버그 APK
        run: ./gradlew --no-daemon :core:jvmTest :androidApp:assembleDebug
