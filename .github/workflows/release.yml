# 릴리스: main 의 커밋에 vX.Y.Z 태그를 올리면 GitHub Release 를 만든다.
#   태그 = apps/web/package.json version = apps/mobile/androidApp versionName, CHANGELOG.md 의 '## vX.Y.Z — YYYY-MM-DD' 절이 있어야 하고
#   (.github/scripts/repo_check.py release), 그 절의 줄이 Release 본문이 된다. 버전 올리기와 태그는 사람이 한다 (CLAUDE.md).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 쓰기 권한(contents: write)이 있는 워크플로라 액션을 태그가 아닌 커밋으로 고정한다 (v7)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 태그가 main 에 있는지
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$GITHUB_REF_NAME 태그가 main 의 커밋이 아닙니다"; exit 1; }
      - name: 버전 · CHANGELOG 확인, 본문 만들기
        run: python3 .github/scripts/repo_check.py release "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Release 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
